[global]
   workgroup = WORKGROUP
   server string = Samba Vulnerable 4.3.8 (SMBv1)
   security = user
   map to guest = Bad User
   # Vulnerable: SMBv1 (NT1) habilitado, named pipes (CVE-2017-7494 SambaCry) y seguimiento de enlaces simbolicos
   server min protocol = NT1
   server max protocol = NT1
   nt pipe support = yes
   ntlm auth = yes
   lanman auth = yes
   follow symlinks = yes
   wide links = yes
   unix extensions = no

[publico]
   path = /srv/samba/publico
   browsable = yes
   writable = yes
   guest ok = yes
   read only = no
   force user = root
