listen=YES
listen_ipv6=NO
# Vulnerable: permite login anonimo, subida de archivos y navegacion fuera del home (sin chroot)
anonymous_enable=YES
anon_root=/var/ftp
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
ftpd_banner=Bienvenido al servidor FTP antiguo (vsftpd 3.0.3 - 2016)
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21105
pasv_address=127.0.0.1
